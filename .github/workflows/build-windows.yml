name: Build Windows EXE

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy
          $exe = Get-ChildItem -Path build -Filter "appAlinaRE.exe" -Recurse | Select-Object -First 1
          Write-Host "EXE found at: $($exe.FullName)"
          Copy-Item $exe.FullName deploy\
          windeployqt --release --qmldir . --no-translations deploy\appAlinaRE.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudokuRE-Windows
          path: deploy\
          retention-days: 30
